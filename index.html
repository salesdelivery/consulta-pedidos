<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Pedidos | Philips</title>
<!-- SheetJS: usado para exportar a carteira para Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#0B5ED7;--blue-dark:#003876;
  --ink:#0A1F33;--paper:#F7F9FC;--line:#DCE3EC;
  --ok:#0F8A5F;--warn:#C77700;--late:#C0392B;--muted:#5A6B7D;
  --prod:#6A3BAD;--dhl-y:#FFCC00;--dhl-r:#D40511;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
/* ── Banner (imagem no topo) ── */
header{position:relative;background:#0A2A5C;padding:0;overflow:hidden;}
.banner-img{display:block;width:100%;aspect-ratio:3.59/1;max-height:320px;object-fit:cover;object-position:center;}
@media(max-width:768px){.banner-img{aspect-ratio:3/1;max-height:none;object-position:22% center;}}
.data-badge{position:absolute;bottom:12px;right:14px;background:rgba(6,18,46,0.75);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:999px;padding:4px 12px;font-size:0.78rem;backdrop-filter:blur(4px);}
nav{background:var(--blue-dark);display:flex;position:relative;z-index:10;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.75);padding:12px 22px;font-size:0.9rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,0.08);}
.nav-btn.active{color:#fff;border-bottom-color:#fff;}
main{max-width:960px;margin:24px auto 60px;padding:0 20px;position:relative;z-index:2;}
.card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(10,31,51,0.08);border:1px solid var(--line);}
.search-card{padding:20px;}
.search-row{display:flex;gap:10px;flex-wrap:wrap;}
.search-row input[type=text],.search-row input[type=password]{flex:1;min-width:200px;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;outline:none;transition:border-color .15s;}
.search-row input:focus{border-color:var(--blue);}
.search-row input:disabled{background:#F5F7FA;color:#A8B4C2;}
button.primary{background:var(--blue);color:#fff;border:none;padding:13px 20px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;}
button.primary:hover{background:var(--blue-dark);}
button.primary:disabled{background:#9BB6D6;cursor:not-allowed;}
button.ghost{background:none;border:1.5px solid var(--line);color:var(--muted);padding:10px 16px;border-radius:10px;font-size:0.85rem;font-weight:600;cursor:pointer;}
button.ghost:hover{border-color:var(--late);color:var(--late);}
button.export{background:#1D6F42;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:0.85rem;font-weight:600;cursor:pointer;white-space:nowrap;}
button.export:hover{background:#155230;}
.load-status{margin-top:12px;font-size:0.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;}
.load-status.ok{color:var(--ok);}
.load-status.err{color:var(--late);}
.spinner{width:16px;height:16px;border:2px solid #DCE3EC;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
#results{margin-top:16px;}
.empty-state{padding:50px 24px;text-align:center;color:var(--muted);}
.empty-state svg{opacity:0.4;margin-bottom:10px;}
.order-card{padding:24px;margin-bottom:16px;}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;}
.order-head .po-label{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.order-head .po-value{font-size:1.1rem;font-weight:700;color:var(--blue-dark);}
.status-pill{display:inline-block;padding:5px 13px;border-radius:999px;font-size:0.8rem;font-weight:700;white-space:nowrap;}
.status-ok{background:#E5F6EE;color:var(--ok);}
.status-warn{background:#FFF3E0;color:var(--warn);}
.status-late{background:#FCEAE8;color:var(--late);}
.status-prod{background:#F0EAF9;color:var(--prod);}
.status-default{background:#EAF1FB;color:var(--blue-dark);}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
@media(max-width:560px){.field-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:3px;}
.field .k{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:600;}
.field .v{font-size:0.95rem;font-weight:500;color:var(--ink);}
.field .v.empty{color:#A8B4C2;font-weight:400;font-style:italic;}
.materials-block{grid-column:1 / -1;margin-top:4px;}
.materials-block .k{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:600;margin-bottom:8px;}
.mat-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
.mat-table th{background:var(--paper);color:var(--muted);font-size:0.7rem;text-transform:uppercase;font-weight:700;padding:7px 10px;text-align:left;border-bottom:2px solid var(--line);}
.mat-table td{padding:7px 10px;border-bottom:1px solid var(--line);}
.mat-table tr:last-child td{border-bottom:none;}
/* Comentário fixo destacado */
.fixed-note{grid-column:1 / -1;background:#FFF8E6;border:1px solid #F0DEAA;border-left:4px solid var(--warn);border-radius:10px;padding:12px 16px;font-size:0.88rem;color:#7A4A00;font-weight:500;}
/* Botão DHL */
.dhl-row{margin-top:14px;display:flex;justify-content:flex-end;}
.dhl-btn{display:inline-flex;align-items:center;gap:8px;background:var(--dhl-y);color:var(--dhl-r);border:none;padding:8px 14px;border-radius:8px;font-size:0.82rem;font-weight:800;font-style:italic;letter-spacing:0.5px;cursor:pointer;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,0.12);transition:transform .1s;}
.dhl-btn:hover{transform:scale(1.04);}
.timeline{margin-top:18px;display:flex;justify-content:space-between;position:relative;padding-top:6px;}
.timeline::before{content:"";position:absolute;top:16px;left:5%;right:5%;height:2px;background:var(--line);z-index:0;}
.tl-step{flex:1;text-align:center;position:relative;z-index:1;}
.tl-dot{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 6px;}
.tl-dot.filled{border-color:var(--blue);background:var(--blue);}
.tl-dot.filled-ok{border-color:var(--ok);background:var(--ok);}
.tl-step .tl-label{font-size:0.62rem;color:var(--muted);font-weight:600;text-transform:uppercase;}
.tl-step .tl-date{font-size:0.72rem;color:var(--ink);margin-top:2px;}
.rep-card{padding:20px;}
.rep-select-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.rep-select-row select{flex:1;min-width:200px;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:0.95rem;outline:none;cursor:pointer;background:#fff;}
.rep-select-row select:focus{border-color:var(--blue);}
.rep-select-row select:disabled{background:#F5F7FA;color:#A8B4C2;}
.login-box{margin-top:14px;padding:16px;background:var(--paper);border-radius:10px;border:1px solid var(--line);}
.login-box .msg{font-size:0.85rem;color:var(--muted);margin-bottom:10px;}
.login-err{color:var(--late);font-size:0.85rem;margin-top:8px;display:none;}
.rep-logged{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;background:#E5F6EE;border-radius:10px;font-size:0.9rem;color:var(--ok);font-weight:600;}
.rep-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rep-search-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.rep-search-row input{flex:1;min-width:180px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:0.9rem;outline:none;}
.rep-search-row input:focus{border-color:var(--blue);}
.rep-table-wrap{margin-top:14px;}
.rep-table{width:100%;border-collapse:collapse;font-size:0.78rem;table-layout:auto;}
.rep-table th{background:var(--blue-dark);color:#fff;font-size:0.66rem;text-transform:uppercase;font-weight:700;padding:9px 8px;text-align:left;white-space:normal;}
.rep-table td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word;}
.rep-table tbody tr{cursor:pointer;}
.rep-table tr:hover td{background:#F0F4FF;}
.rep-table tr:last-child td{border-bottom:none;}
.rep-summary{font-size:0.82rem;color:var(--muted);margin-bottom:10px;}
.rep-hint{font-size:0.75rem;color:var(--muted);margin-top:8px;font-style:italic;}
#repResults .card{width:calc(100vw - 40px);max-width:1600px;position:relative;left:50%;transform:translateX(-50%);}
@media(max-width:1000px){#repResults .card{width:100%;left:auto;transform:none;}.rep-table-wrap{overflow-x:auto;}}
.page{display:none;}
.page.active{display:block;}
footer{text-align:center;color:var(--muted);font-size:0.78rem;padding:10px 20px 30px;}
</style>
</head>
<body>

<header>
  <img class="banner-img" src="banner.jpg" alt="Philips — Consulta de Pedidos. Acompanhe cada etapa. Entregamos confiança.">
  <div class="data-badge" id="dataBadge">Carregando base de dados...</div>
</header>

<nav>
  <button class="nav-btn active" id="navConsulta">🔍 Consulta de Pedido</button>
  <button class="nav-btn" id="navRep">👤 Carteira Representante</button>
</nav>

<main>

  <!-- ══════════ ABA: CONSULTA DE PEDIDO ══════════ -->
  <div class="page active" id="page-consulta">
    <div class="card search-card">
      <div class="search-row">
        <input type="text" id="poInput" placeholder="Digite o número da Customer PO..." autocomplete="off" disabled>
        <button class="primary" id="searchBtn" disabled>Consultar</button>
      </div>
      <div class="load-status" id="loadStatus"><span class="spinner"></span> Conectando à base de dados...</div>
    </div>
    <div id="results"></div>
  </div>

  <!-- ══════════ ABA: CARTEIRA REPRESENTANTE ══════════ -->
  <div class="page" id="page-representante">
    <div class="card rep-card">
      <div class="rep-select-row">
        <select id="repSelect" disabled>
          <option value="">Selecione o Representante...</option>
        </select>
      </div>
      <div class="login-box" id="loginBox" style="display:none;">
        <div class="msg">🔒 Digite a senha de acesso da carteira <strong id="loginRepName"></strong>:</div>
        <div class="search-row">
          <input type="password" id="pwdInput" placeholder="Senha..." autocomplete="off">
          <button class="primary" id="loginBtn">Acessar</button>
        </div>
        <div class="login-err" id="loginErr">❌ Senha incorreta. Tente novamente.</div>
      </div>
      <div class="rep-logged" id="repLogged" style="display:none;">
        <span id="repLoggedName"></span>
        <div class="rep-actions">
          <button class="export" id="exportBtn">📥 Exportar para Excel</button>
          <button class="ghost" id="logoutBtn">Sair</button>
        </div>
      </div>
      <div class="rep-search-row" id="repSearchRow" style="display:none;">
        <input type="text" id="repPoSearch" placeholder="Pesquisar por Customer PO No..." autocomplete="off">
      </div>
    </div>
    <div id="repResults" style="margin-top:16px;"></div>
  </div>

</main>

<footer>Philips Medical Systems &middot; Sales &amp; Service Delivery</footer>

<script>
// =============================================================
// CONFIGURAÇÃO
// =============================================================
var JSON_URL = "https://salesdelivery.github.io/consulta-pedidos/carteira.json"; // ← Cole aqui o link do carteira.json
// =============================================================

// ── Mapa de padronização: RAZÃO SOCIAL → Nome do Representante ──
var NAME_MAP = {

"UNICA IMAGEM PRO E SER P DIAG LT ME":"ÚNICA/DANN",
"SERVICOS LTDA XTEC COMERCIO E":"XTEC"
};

// ── Hashes SHA-256 das senhas de cada representante ──
var PWD_HASHES = {
"4MEDIC":"7523fe409622aae7c5c1346b92df99c46c1bf6c27190735f51e0dce139a0d93e",
"AGUIAR":"e3f62d57a67264b1f4e938f67ce2e2ee16e7166371a6257f60063fbc59bbc0c5",
"ALLIANCE":"16b259aef3c7967519b11c647f17b71ae59527aabd30f4b4d616687039e323be",
"BS IMAGEM":"2e7155a8b97ded14bfee42f4624ea707cecb83f2fba0ba3f6706aa2db9536bf1",
"BSB":"b4687b2a69bb2556937595657bcebed8aa63b62adcf7a1e3517a0efbf6d83a35",
"CANAL DIRETO":"de95bef9bad2568cfd19dd988ff7781189129643cc999077c9f06af28768d565",
"CARDIOVENT":"60e186e974b34fd0390e651df4102006cca3b54b9610460cb5eb9d4ac468fd8b",
"EQUIPAR":"311349fb5daaf4b94032aa165d40f7ad4f1534972bb70aa87cc0caefcad1e4f8",
"MEDICAL EVOLUTION":"aa67dc8e9f4e505eed7280f430867fb8f399bd0fb3d747e8b68ca39e59196579",
"MULT MED":"1282098de19d0d32a258101b78afb5d94114bbee1b72043f203fcf0d219c77cb",
"NEXT":"7bcf52e92289b993baa485a5b13eab534e92538fa066109448f20a34ee34af3f",
"NS HOSPITALAR":"84ea406e9da663e152a2b633974ca74135be8bcadaf32029be76ab280db55ad0",
"POLLIMED":"f51372a8ded763053595e2518ed19e8cb15b83ff38b44270fc92aad54544ed62",
"PROMEDCARE":"c4a0f40705f80316460b6ea91a71649163f28b894b0eb8b6af9ad9f52c9fb1da",
"STANK HELP":"574eb2f1e5c855f24c6e8b62cefafe65af8e9f2248e81badf13b107d08606af5",
"TECH MED":"0d780b14a33e87959e34edd4e8f80b0b89a8caa8ddf21eceb79fed144147d184",
"TECNOLIFE":"46593b2222c47d989330fe6427f1d840fd86627011993528e9712807bd91da0e",
"TECNOMEDICA":"bf29576ba6be0a3cfcfe94dbb4d2ec01e2755ef0f5f4746673ac92c4e44f7fe0",
"ÚNICA/DANN":"76a91844d8bba5d2062dc0a3064eaa2c39288c725d1de5578699c91ac89d1459",
"XTEC":"b2c4f1757505462c2fe85b3bea0b69a2c1081c8e7978892c7cd5743e2394994a"
};

// ── Mapeamento das colunas do JSON ──
var COLS = {
  po:"Customer PO No.", creation:"Creation Date", customer:"Sold to Customer Name",
  material:"Material Description", materialCode:"Material",
  prazo:"Prazo Contratual", am:"Account Manager Name", status:"Status",
  deliveryDate:"Data de Entrega", installDate:"Data de Instalação",
  qty:"QTY", z4:"Z4 Date", billing:"Billing Date", pgto:"PGTO",
  comentario:"Comentários S&SD", pareto:"Pareto Nivel 1",
  prevEstoque:"Previsão de Estoque",   // nova coluna (1.2)
  empenho:"Data do Empenho",           // nova coluna (1.3)
  publico:"Público Privado"            // nova coluna (2.3)
};

var DATA = [];
var loggedRep = null;

var poInput=document.getElementById("poInput"), searchBtn=document.getElementById("searchBtn"),
    results=document.getElementById("results"), loadStatus=document.getElementById("loadStatus"),
    dataBadge=document.getElementById("dataBadge"), repSelect=document.getElementById("repSelect"),
    repResults=document.getElementById("repResults"), loginBox=document.getElementById("loginBox"),
    loginRepName=document.getElementById("loginRepName"), pwdInput=document.getElementById("pwdInput"),
    loginBtn=document.getElementById("loginBtn"), loginErr=document.getElementById("loginErr"),
    repLogged=document.getElementById("repLogged"), repLoggedName=document.getElementById("repLoggedName"),
    logoutBtn=document.getElementById("logoutBtn"), repSearchRow=document.getElementById("repSearchRow"),
    repPoSearch=document.getElementById("repPoSearch"), exportBtn=document.getElementById("exportBtn"),
    navConsulta=document.getElementById("navConsulta"), navRep=document.getElementById("navRep");

// ── Navegação entre abas ──
navConsulta.addEventListener("click", function(){ switchPage("consulta"); });
navRep.addEventListener("click", function(){ switchPage("representante"); });
function switchPage(name) {
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".nav-btn").forEach(function(b){ b.classList.remove("active"); });
  document.getElementById("page-"+name).classList.add("active");
  (name==="consulta"?navConsulta:navRep).classList.add("active");
}

// ── Helpers ──
function normalizeRep(name) {
  if (!name) return null;
  var t = String(name).trim();
  return NAME_MAP[t] || t;
}
function excelToDate(val) {
  if (val===null||val===undefined||val===""||val==="NaT") return null;
  if (typeof val==="number" && val>40000 && val<60000) {
    var d = new Date(Date.UTC(1899,11,30));
    d.setUTCDate(d.getUTCDate()+Math.floor(val));
    return d;
  }
  if (typeof val==="string" && val.length>=8) {
    var p = new Date(val);
    if (!isNaN(p.getTime())) return p;
  }
  return null;
}
function fmtDate(val) {
  var d = excelToDate(val);
  if (!d) return null;
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear();
}
function maxDate(a,b) {
  var da=excelToDate(a), db=excelToDate(b);
  if(!da&&!db) return null;
  if(!da) return b;
  if(!db) return a;
  return da>=db?a:b;
}
// Identifica se o pedido é público (licitação)
function isPublico(val) {
  return String(val||"").toLowerCase().indexOf("públic") !== -1 ||
         String(val||"").toLowerCase().indexOf("public") !== -1;
}
function sha256(str) {
  var buf = new TextEncoder().encode(str);
  return crypto.subtle.digest("SHA-256", buf).then(function(hash){
    var arr = Array.prototype.slice.call(new Uint8Array(hash));
    return arr.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  });
}

// ── Carga da base ──
function loadData() {
  if (!JSON_URL) {
    loadStatus.className="load-status err";
    loadStatus.innerHTML="⚠️ JSON_URL não configurado.";
    dataBadge.textContent="Base não configurada";
    return;
  }
  fetch(JSON_URL,{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(json){
      DATA=(json.dados||[]).filter(function(r){ return r[COLS.po]; });
      var g=json.gerado_em?new Date(json.gerado_em):null;
      var ds=g?fmtDate(g.toISOString()):"—";
      loadStatus.className="load-status ok";
      loadStatus.innerHTML="✓ "+DATA.length+" itens carregados · Atualizado em "+ds;
      dataBadge.textContent="Base atualizada em "+ds;
      poInput.disabled=false; searchBtn.disabled=false; poInput.focus();
      populateReps();
      results.innerHTML=emptyCard("Base carregada","Digite o número da PO para consultar.");
    })
    .catch(function(e){
      loadStatus.className="load-status err";
      loadStatus.innerHTML="❌ Não foi possível carregar a base. Verifique o link ou as permissões.";
      dataBadge.textContent="Erro ao carregar";
      console.error(e);
    });
}
function emptyCard(title, sub) {
  return '<div class="card"><div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div><strong>'+title+'</strong></div><div>'+(sub||"")+'</div></div></div>';
}

// ── Agrupamento por PO ──
// Regras: linhas com mesmas datas → agrupa materiais no mesmo quadro.
//         datas diferentes → considera a maior data de cada campo.
function groupByPO(items) {
  var m = {};
  for (var i=0;i<items.length;i++) {
    var it=items[i], po=String(it[COLS.po]||"").trim();
    if (!m[po]) {
      m[po]={po:po,creation:it[COLS.creation],customer:it[COLS.customer],
        prazo:it[COLS.prazo],am:normalizeRep(it[COLS.am]),status:it[COLS.status],
        delivery:it[COLS.deliveryDate],install:it[COLS.installDate],z4:it[COLS.z4],
        billing:it[COLS.billing],pgto:it[COLS.pgto],
        comentario:it[COLS.comentario],pareto:it[COLS.pareto],
        prevEstoque:it[COLS.prevEstoque],empenho:it[COLS.empenho],publico:it[COLS.publico],
        materials:[]};
    } else {
      m[po].creation=maxDate(m[po].creation,it[COLS.creation]);
      m[po].prazo=maxDate(m[po].prazo,it[COLS.prazo]);
      m[po].delivery=maxDate(m[po].delivery,it[COLS.deliveryDate]);
      m[po].install=maxDate(m[po].install,it[COLS.installDate]);
      m[po].z4=maxDate(m[po].z4,it[COLS.z4]);
      m[po].billing=maxDate(m[po].billing,it[COLS.billing]);
      m[po].prevEstoque=maxDate(m[po].prevEstoque,it[COLS.prevEstoque]);
      m[po].empenho=maxDate(m[po].empenho,it[COLS.empenho]);
      if(!m[po].status&&it[COLS.status])m[po].status=it[COLS.status];
      if(!m[po].pgto&&it[COLS.pgto])m[po].pgto=it[COLS.pgto];
      if(!m[po].pareto&&it[COLS.pareto])m[po].pareto=it[COLS.pareto];
      if(!m[po].publico&&it[COLS.publico])m[po].publico=it[COLS.publico];
    }
    m[po].materials.push({code:it[COLS.materialCode],desc:it[COLS.material],qty:it[COLS.qty]});
  }
  return m;
}

// ── Status do pedido ──
function statusPill(g) {
  var delivery=excelToDate(g.delivery), z4=excelToDate(g.z4), billing=excelToDate(g.billing),
      prazo=excelToDate(g.prazo), now=new Date();
  if (delivery) return '<span class="status-pill status-ok">✓ Entregue</span>';
  if (z4 && !billing) return '<span class="status-pill status-prod">⚙ Em Produção</span>';
  if (prazo && prazo<now) return '<span class="status-pill status-late">⚠ Atrasado</span>';
  if (prazo) { var diff=(prazo-now)/(864e5); if(diff<=30) return '<span class="status-pill status-warn">Em andamento</span>'; }
  return '<span class="status-pill status-default">Em andamento</span>';
}

function field(label,value) {
  var cls=value?"":"empty", d=value?String(value):"—";
  return '<div class="field"><span class="k">'+label+'</span><span class="v '+cls+'">'+d+'</span></div>';
}

// ── Card do pedido (Consulta) ──
function renderOrderCard(g) {
  var matRows="";
  for (var i=0;i<g.materials.length;i++) {
    var mt=g.materials[i];
    matRows+='<tr><td>'+(mt.code||"—")+'</td><td>'+(mt.desc||"—")+'</td><td style="text-align:center">'+(mt.qty||"—")+'</td></tr>';
  }
  var h='<div class="card order-card">';
  h+='<div class="order-head"><div><div class="po-label">Customer PO No.</div><div class="po-value">'+g.po+'</div></div>'+statusPill(g)+'</div>';
  h+='<div class="field-grid">';
  h+=field("Cliente",g.customer);
  h+=field("Representante",g.am);
  h+=field("Data de Booking",fmtDate(g.creation));
  h+=field("Prazo Contratual",fmtDate(g.prazo));
  h+=field("Previsão de Estoque",fmtDate(g.prevEstoque));
  h+=field("Status Pagamento",g.pgto);
  h+=field("Planejamento",g.pareto);
  // 1.3 — Data do Empenho: somente para pedidos Públicos
  if (isPublico(g.publico)) {
    h+=field("Data do Empenho", fmtDate(g.empenho) || "À confirmar");
  }
  // Tabela de materiais
  h+='<div class="materials-block field"><div class="k">Materiais</div><table class="mat-table"><thead><tr><th>Código</th><th>Descrição</th><th style="text-align:center">Qtd</th></tr></thead><tbody>'+matRows+'</tbody></table></div>';
  // 1.7 — Comentário fixo destacado (sempre visível)
  h+='<div class="fixed-note">📌 Data de entrega será entre 10 a 15 dias da data de entrada de estoque (se status Pagamento Aprovado).</div>';
  h+='</div>';
  h+=buildTimeline(g);
  // 1.8 — Link DHL Track & Trace (próximo ao Faturamento na linha do tempo)
  h+='<div class="dhl-row"><a class="dhl-btn" href="https://mysctrackandtrace.dhl.com/" target="_blank" rel="noopener" title="Rastrear Nota Fiscal na DHL">DHL &nbsp;▸ Rastrear Nota Fiscal</a></div>';
  h+='</div>';
  return h;
}

// ── Linha do tempo (sem RDD e sem Entrada no Estoque) ──
function buildTimeline(g) {
  var steps=[
    {label:"Booking",date:g.creation},
    {label:"Previsão de Estoque",date:g.prevEstoque},
    {label:"Produção",date:g.z4},
    {label:"Faturamento",date:g.billing},
    {label:"Entrega",date:g.delivery},
    {label:"Instalação",date:g.install}
  ];
  var h='<div class="timeline">';
  for (var i=0;i<steps.length;i++) {
    var s=steps[i], has=excelToDate(s.date)!==null;
    var cls=has?(s.label==="Entrega"||s.label==="Instalação"?"filled-ok":"filled"):"";
    h+='<div class="tl-step"><div class="tl-dot '+cls+'"></div><div class="tl-label">'+s.label+'</div><div class="tl-date">'+(fmtDate(s.date)||"—")+'</div></div>';
  }
  h+='</div>';
  return h;
}

// ── Pesquisa por PO (Consulta) ──
function doSearch() {
  var q=poInput.value.trim().toLowerCase();
  if (!q) return;
  var mt=DATA.filter(function(r){ return String(r[COLS.po]||"").toLowerCase().indexOf(q)!==-1; });
  if (!mt.length) { results.innerHTML=emptyCard("Nenhum pedido encontrado","Verifique o número da PO e tente novamente."); return; }
  var g=groupByPO(mt), h="";
  for (var po in g) h+=renderOrderCard(g[po]);
  results.innerHTML=h;
}
// 2.4 — abre a Consulta com uma PO específica (clique na linha da Carteira)
function openConsultaWithPO(po) {
  switchPage("consulta");
  poInput.value = po;
  searchBtn.disabled = false;
  doSearch();
  window.scrollTo({top:0, behavior:"smooth"});
}
poInput.addEventListener("keydown",function(e){ if(e.key==="Enter") doSearch(); });
poInput.addEventListener("input",function(){ searchBtn.disabled=!(DATA.length&&poInput.value.trim()); });
searchBtn.addEventListener("click",doSearch);

// ── Carteira Representante ──
function populateReps() {
  var reps={};
  for (var i=0;i<DATA.length;i++) {
    var am=normalizeRep(DATA[i][COLS.am]);
    if (am) reps[am]=true;
  }
  var sorted=Object.keys(reps).sort();
  var h='<option value="">Selecione o Representante...</option>';
  for (var j=0;j<sorted.length;j++) {
    h+='<option value="'+sorted[j].replace(/"/g,'&quot;')+'">'+sorted[j]+'</option>';
  }
  repSelect.innerHTML=h;
  repSelect.disabled=false;
}

repSelect.addEventListener("change",function(){
  var rep=repSelect.value;
  logout(false);
  if (!rep) { loginBox.style.display="none"; return; }
  loginRepName.textContent=rep;
  loginBox.style.display="block";
  loginErr.style.display="none";
  pwdInput.value="";
  pwdInput.focus();
});

loginBtn.addEventListener("click",tryLogin);
pwdInput.addEventListener("keydown",function(e){ if(e.key==="Enter") tryLogin(); });

function tryLogin() {
  var rep=repSelect.value, pwd=pwdInput.value;
  if (!rep||!pwd) return;
  sha256(pwd).then(function(hash){
    if (PWD_HASHES[rep] && hash===PWD_HASHES[rep]) {
      loggedRep=rep;
      loginBox.style.display="none";
      repLogged.style.display="flex";
      repLoggedName.textContent="✓ Carteira: "+rep;
      repSearchRow.style.display="flex";
      repPoSearch.value="";
      renderRepTable();
    } else {
      loginErr.style.display="block";
      pwdInput.value="";
      pwdInput.focus();
    }
  });
}

logoutBtn.addEventListener("click",function(){ logout(true); });
function logout(resetSelect) {
  loggedRep=null;
  repLogged.style.display="none";
  repSearchRow.style.display="none";
  repResults.innerHTML="";
  if (resetSelect) { repSelect.value=""; loginBox.style.display="none"; }
}

repPoSearch.addEventListener("input",renderRepTable);

// Colunas da tabela da Carteira (2.1 Cliente e 2.3 Licitação adicionadas)
function getRepCols() {
  return [
    {key:COLS.po,label:"Customer PO No."},
    {key:COLS.customer,label:"Cliente"},
    {key:COLS.materialCode,label:"Material"},
    {key:COLS.material,label:"Descrição"},
    {key:COLS.qty,label:"Qtd"},
    {key:COLS.am,label:"Representante",isRep:true},
    {key:COLS.pgto,label:"Status Pagamento"},
    {key:COLS.prevEstoque,label:"Previsão de Estoque",isDate:true},
    {key:COLS.publico,label:"Licitação",isLicitacao:true},
    {key:COLS.comentario,label:"Informações Relevantes"},
    {key:COLS.pareto,label:"Planejamento"}
  ];
}

// Retorna as linhas atualmente filtradas da carteira
// Exibe apenas ordens em aberto: Status em branco ou "Installing".
// Ordens com Status "Recognized" (faturadas/instaladas) não aparecem.
function getFilteredRepRows() {
  if (!loggedRep) return [];
  var q=repPoSearch.value.trim().toLowerCase();
  return DATA.filter(function(r){
    if (normalizeRep(r[COLS.am])!==loggedRep) return false;
    // Filtro de ordens em aberto
    var st=String(r[COLS.status]||"").trim().toLowerCase();
    if (st!=="" && st!=="installing") return false;
    if (q && String(r[COLS.po]||"").toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
}

function cellValue(row, col) {
  var v=row[col.key];
  if (col.isRep) v=normalizeRep(v);
  else if (col.isDate) v=fmtDate(v)||"—";
  else if (col.isLicitacao) v=(v!==null&&v!==undefined&&v!=="")?v:"À confirmar";
  return (v!==null&&v!==undefined&&v!=="")?v:"—";
}

function renderRepTable() {
  if (!loggedRep) return;
  var mt=getFilteredRepRows();
  var q=repPoSearch.value.trim();
  if (!mt.length) {
    repResults.innerHTML='<div class="card"><div class="empty-state"><div>Nenhum pedido encontrado'+(q?" para esta pesquisa":" para este representante")+'.</div></div></div>';
    return;
  }
  var cols=getRepCols();
  var thead="<tr>";
  for (var c=0;c<cols.length;c++) thead+="<th>"+cols[c].label+"</th>";
  thead+="</tr>";
  var tbody="";
  for (var i=0;i<mt.length;i++) {
    var po=String(mt[i][COLS.po]||"").replace(/"/g,'&quot;');
    tbody+='<tr data-po="'+po+'">';
    for (var c2=0;c2<cols.length;c2++) {
      tbody+="<td>"+cellValue(mt[i],cols[c2])+"</td>";
    }
    tbody+="</tr>";
  }
  repResults.innerHTML='<div class="card" style="padding:20px;"><div class="rep-summary"><strong>'+mt.length+'</strong> ordens em aberto na carteira de <strong>'+loggedRep+'</strong>'+(q?' (filtrado por "'+q+'")':'')+'</div><div class="rep-table-wrap"><table class="rep-table" id="repTable"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div><div class="rep-hint">💡 Clique em uma linha para abrir a Consulta do Pedido</div></div>';

  // 2.4 — clique na linha abre a Consulta de Pedido
  var rows=document.querySelectorAll("#repTable tbody tr");
  for (var r=0;r<rows.length;r++) {
    rows[r].addEventListener("click", function(){
      openConsultaWithPO(this.getAttribute("data-po"));
    });
  }
}

// 2.2 — Exportar para Excel os dados filtrados (com cabeçalhos)
exportBtn.addEventListener("click", function(){
  var mt=getFilteredRepRows();
  if (!mt.length) return;
  var cols=getRepCols();
  var aoa=[cols.map(function(c){ return c.label; })];
  for (var i=0;i<mt.length;i++) {
    var row=[];
    for (var c=0;c<cols.length;c++) {
      var v=cellValue(mt[i],cols[c]);
      row.push(v==="—"?"":v);
    }
    aoa.push(row);
  }
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Carteira");
  var fname="Carteira_"+loggedRep.replace(/[^A-Za-z0-9]/g,"_")+"_"+new Date().toISOString().split("T")[0]+".xlsx";
  XLSX.writeFile(wb,fname);
});

// ── Init ──
results.innerHTML=emptyCard("Carregando base de dados...","");
loadData();
</script>
